# wl-cameras — CCTV mirror (issue #67, Phase 3).
#
# Deliberately a separate Worker and a separate config from wl-sync: this is the part
# that moves real bytes (~11 MB per full cycle vs ~200 KB for the snapshot), so it is
# the one most likely to need throttling or rolling back on its own.
#
# No cron trigger yet. Phase 5 schedules it as `*/5 * * * *`, mirroring a clock-derived
# third of the camera list so every camera refreshes every 15 minutes.
name = "wl-cameras"
main = "src/cameras-index.ts"
compatibility_date = "2026-07-01"
workers_dev = true

[[r2_buckets]]
binding = "SNAPSHOT"
bucket_name = "riverlevel-snapshot"
preview_bucket_name = "riverlevel-snapshot-staging"

# Read-only here: the mirror consults the water level sync's status to decide whether
# JPS is worth calling at all.
[[kv_namespaces]]
binding = "SYNC_STATE"
id = "placeholder-set-at-phase-5"

[vars]
JPS_BASE_URL = "https://infobanjirjps.selangor.gov.my/JPSAPI/api"

# ---------------------------------------------------------------------------
# Staging (Phase 5). Deploy with: wrangler deploy --env staging --config workers/wrangler.cameras.toml
#
# Wrangler environments do NOT inherit bindings from the top level — every binding
# has to be repeated here. Omitting one does not error; it deploys without it.
#
# Points at a separate bucket, never a prefix inside the production one: a wrong key
# here would overwrite the live snapshot, and a separate bucket makes that impossible
# rather than merely unlikely.
# ---------------------------------------------------------------------------
[env.staging]
name = "wl-cameras-staging"

[[env.staging.r2_buckets]]
binding = "SNAPSHOT"
bucket_name = "riverlevel-snapshot-staging"

[[env.staging.kv_namespaces]]
binding = "SYNC_STATE"
id = "placeholder-create-with-wrangler-kv-namespace-create"

[env.staging.vars]
JPS_BASE_URL = "https://infobanjirjps.selangor.gov.my/JPSAPI/api"
SITE_URL = "https://riverlevel.netlify.app"
