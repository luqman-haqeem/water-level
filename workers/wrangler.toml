# wl-sync — water level sync Worker (issue #67).
#
# Phase 1 scaffolds this; the scheduled() handler is filled in at Phase 2. Cron
# triggers are deliberately NOT declared yet: an empty handler firing every 5
# minutes would publish nothing while looking like it works.
#
# The camera mirror (`wl-cameras`) gets its own config at Phase 3, so the two can
# fail and be rolled back independently.
name = "wl-sync"
main = "src/index.ts"
compatibility_date = "2026-07-01"
workers_dev = true

# Public snapshot bucket. Overridden per environment; tests get a local simulated
# bucket from Miniflare and never touch a real one.
[[r2_buckets]]
binding = "SNAPSHOT"
bucket_name = "riverlevel-snapshot"
preview_bucket_name = "riverlevel-snapshot-dev"

# Replaces the Convex `syncState` table and the `notificationLog` cooldown.
# ~288 writes/day against the free plan's 1,000/day.
[[kv_namespaces]]
binding = "SYNC_STATE"
id = "placeholder-set-at-phase-5"

[vars]
JPS_BASE_URL = "https://infobanjirjps.selangor.gov.my/JPSAPI/api"
SITE_URL = "https://riverlevel.netlify.app"

# Secrets, set with `wrangler secret put` — never in this file:
#   ONESIGNAL_APP_ID, ONESIGNAL_REST_API_KEY
# Danger alerts are skipped with a warning when either is missing, so a staging
# deployment without them syncs normally instead of failing.

# ---------------------------------------------------------------------------
# Staging (Phase 5). Deploy with: wrangler deploy --env staging --config workers/wrangler.toml
#
# Wrangler environments do NOT inherit bindings from the top level — every binding
# has to be repeated here. Omitting one does not error; it deploys without it.
#
# Points at riverlevel-snapshot-dev — a separate bucket, never a prefix inside the
# production one: a wrong key under a shared bucket would overwrite the live snapshot,
# and a separate bucket makes that impossible rather than merely unlikely. The dev
# bucket is reused rather than a new one created because it already has public access
# configured, which is what makes the frontend click-through possible.
# ---------------------------------------------------------------------------
[env.staging]
name = "wl-sync-staging"

[[env.staging.r2_buckets]]
binding = "SNAPSHOT"
bucket_name = "riverlevel-snapshot-dev"

[[env.staging.kv_namespaces]]
binding = "SYNC_STATE"
id = "306d01a3aedf464ab99b99a84b884662"

[env.staging.vars]
JPS_BASE_URL = "https://infobanjirjps.selangor.gov.my/JPSAPI/api"
SITE_URL = "https://riverlevel.netlify.app"

# Staging schedule only — the top-level (production) config still declares no triggers.
# */15 water levels; the weekly camera roster is branched on controller.cron.
#
# "SUN", not "0": Cloudflare weekdays run 1 = Sunday to 7 = Saturday, off by one from
# standard cron, and it rejects 0 outright. The name sidesteps the whole question.
[env.staging.triggers]
crons = ["*/15 * * * *", "0 2 * * SUN"]
