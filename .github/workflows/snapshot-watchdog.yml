name: Snapshot watchdog

# Dead-man's switch for the R2 snapshot (#67). Runs off Cloudflare on purpose: after
# cutover Cloudflare is writer, store and delivery path, so nothing there would notice
# its own outage. Logic and threshold: scripts/snapshotWatchdog.mjs.
#
# Alerts on Telegram only when BOTH publishers (Worker + Convex standby) are down —
# not when JPS alone is down, which the owner cannot fix. One message when it goes
# down, one when it recovers. An open `snapshot-stale` issue is how the workflow
# remembers it already alerted; nobody needs to act on the issue itself.
#
# Setup (Settings → Secrets and variables → Actions):
#   variable SNAPSHOT_BASE_URL   production r2.dev URL; dormant until set
#   secret   TELEGRAM_BOT_TOKEN  bot token (only sendMessage is used)
#   secret   TELEGRAM_CHAT_ID    your chat id with that bot
# Without the Telegram secrets the run fails instead, and GitHub emails you.
# Scheduled workflows only run from the default branch.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

concurrency:
  group: snapshot-watchdog
  cancel-in-progress: false

jobs:
  check:
    if: vars.SNAPSHOT_BASE_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      LABEL: snapshot-stale
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Assess meta.json
        id: assess
        env:
          BASE_URL: ${{ vars.SNAPSHOT_BASE_URL }}
          MAX_AGE: ${{ vars.SNAPSHOT_MAX_AGE_MINUTES }}
        run: |
          result=$(node scripts/snapshotWatchdog.mjs "$BASE_URL" "$MAX_AGE")
          echo "$result"
          echo "result=$result" >> "$GITHUB_OUTPUT"

      - name: Alert on change
        env:
          RESULT: ${{ steps.assess.outputs.result }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          alert=$(jq -r .alert <<<"$RESULT")
          open=$(gh issue list --label "$LABEL" --state open --json number -q '.[0].number')
          details=$(jq -r '"\(.reason)\nsyncedAt: \(.syncedAt)\nattemptedAt: \(.attemptedAt)\npublisher: \(.publisher)"' <<<"$RESULT")
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          notify() {
            if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
              echo "::error::Telegram secrets not set — failing so GitHub emails instead. $1"
              exit 1
            fi
            curl -fsS -o /dev/null "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=$1" \
              --data-urlencode "disable_web_page_preview=true"
          }

          if [ "$alert" = "true" ] && [ -z "$open" ]; then
            notify "$(printf '🚨 River level: both publishers are down\n\n%s\n\n%s' "$details" "$run_url")"
            gh label create "$LABEL" --color B60205 --description "Snapshot watchdog state" 2>/dev/null || true
            gh issue create --label "$LABEL" --title "Snapshot publishers down" \
              --body "$(printf 'Alert sent on Telegram. Closes itself on recovery.\n\n%s\n\n%s' "$details" "$run_url")"
          elif [ "$alert" != "true" ] && [ -n "$open" ]; then
            notify "$(printf '✅ River level: publishing again\n\n%s' "$details")"
            gh issue close "$open" --comment "Recovered. $run_url"
          fi
